name: Carbon Budget Gate

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  carbon-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and evaluation dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Verify fresh canonical evidence and mirrors
        run: python workbook/evidence.py --check --fresh

      - name: Test carbon and dashboard contracts
        run: python -m unittest discover -s tests

      - name: Run CO2e budget check
        run: |
          python workbook/calc_co2e.py 200
